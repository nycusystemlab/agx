# zenoh-bridge-dds —— SIM ↔ 實車的 ROS 2 橋接
#
# 設定檔不在本 repo：它是網路設定的一部分，收在 infra repo（lab-nas-infra）的
# robot-net/zenoh/，由那邊依 infra.env 展開後複製到本目錄（zenoh/*.json5 已 gitignore）。
#
#   車上：  docker compose -f zenoh/docker-compose.yaml up -d
#   SIM：   ZENOH_BRIDGE_CONFIG=sim-bridge.json5 docker compose -f zenoh/docker-compose.yaml up -d
# ⚠️ 與 rmw_zenoh 互斥：planning 的預設中介軟體已是 rmw_zenoh_cpp，而車上的
#    zenohd router（infra repo 的 systemd unit rmw-zenohd）與這座橋都 listen 7447。
#    兩者同時起會有一方 Address already in use。切到 rmw_zenoh 的機器上不要起這個
#    service（根目錄的 docker compose up 要逐一指名服務，或先 docker compose stop zenoh-bridge）。
services:
  zenoh-bridge:
    image: eclipse/zenoh-bridge-dds:1.10.0 # 設定檔的鍵名對照這版的 DEFAULT_CONFIG.json5
    container_name: ${CONTAINER_PREFIX:-}zenoh-bridge

    # 要與本機 DDS 參與者同一個網路命名空間才看得到探索封包
    network_mode: host

    environment:
      - RUST_LOG=${ZENOH_LOG:-zenoh=info,zenoh_plugin_dds=info}

    # 掛整個目錄而非單一檔案：bind mount 來源不存在時 docker 會建同名目錄，
    # bridge 拿到目錄當設定檔的錯誤訊息非常難懂
    volumes:
      - ./:/config:ro

    command: ["-c", "/config/${ZENOH_BRIDGE_CONFIG:-robot-bridge.json5}"]

    restart: unless-stopped
