# Nav2 實體機器人 override — 與 nav2_params_base.yaml 深度合併後使用
# 從 nav2_params_sim.yaml 移植：對齊 sim 已驗證的 RPP 速度/lookahead/progress 參數
# 與 sim 的差異：
#   - 用 RotationShimController 包 RPP（sim 端 shim 會靜默失敗）
#   - max_angular_accel: 2.0（sim 用 12.0 是 Isaac Sim 死區的 hack，real 不需要）
#   - velocity_smoother angular accel 對齊 max_angular_accel（real 不需 12.0）
#   - amcl 不設 set_initial_pose（real 用 Foxglove 對 /initialpose 校位姿）
#   - amcl 不 override max_particles / update_min_a（real 用 base 預設 2000 / 0.2）
#   - odom_topic: /raw_odom（real 繞過 EKF，直接吃 kinematics_node odom）

bt_navigator:
  ros__parameters:
    odom_topic: /raw_odom

amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 20.0
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # RotationShim 參數（real-only，sim 端不掛 shim）
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 1.2
      max_angular_accel: 2.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false

      # RPP 參數（從 sim 移植）
      desired_linear_vel: 0.6
      lookahead_dist: 1.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.5
      lookahead_time: 0.8
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.2
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.8
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.3
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      stateful: true
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      max_angular_vel: 4.0

behavior_server:
  ros__parameters:
    max_rotational_vel: 2.0
    min_rotational_vel: 0.5

velocity_smoother:
  ros__parameters:
    odom_topic: "/raw_odom"
    max_velocity: [1.5, 0.0, 2.0]
    min_velocity: [-0.3, 0.0, -2.0]
    max_accel: [0.6, 0.0, 2.5]      # angular accel: real 用 2.5，sim 的 12.0 是 deadband hack
    max_decel: [-3.0, 0.0, -3.2]
    deadband_velocity: [0.02, 0.0, 0.2]
