name: Dockerfile Lint CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Lint all Dockerfiles (Syntax Verification)
      run: |
        # 使用 hadolint 檢查所有 Dockerfile 的語法與最佳實踐
        find . -maxdepth 2 -name "*Dockerfile*" -type f | while read -r file; do
          echo "Linting $file..."
          docker run --rm -i hadolint/hadolint < "$file" || echo "Found warnings in $file but continuing..."
        done
